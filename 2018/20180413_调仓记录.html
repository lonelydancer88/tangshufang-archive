<h1>调仓记录</h1>
<p>文字_2018-04-13唐书房 2018-04-13今天继续抛弃小国子，换入2%的茅台。当前持仓茅台46%-，腾讯18%-，民生H6%-，招商H5%-，古井B6%+，洋河6%-，双汇5%+，信立泰4%+，海康3%-，国投2%-。最后的2%国投准备留给企鹅，估计很快也会卖掉了。 在廉价与优质之间，越来越倾向于后者。认错自己的水电投资，持有两投约四年，最终获利仅约20%~30%。 2018年内的收益约-2%。2014年11月25日建立的老唐实盘组合净值2.89元，同期实盘净值3.13元，差异因组合无法录入港股和B股造成。 个人记录，请勿模仿。</p>
