<h1>别催，进行中……</h1>
<p>别催，进行中……上周看了约八十份格力作业，可能用手机的时间过多了，肩膀和脖子的肌肉非常不舒服，周末停工啥也没干。原计划周末看完五粮液和口子窖后一起写的主要白酒公司财报简评，也就拖下了——作业这事儿啊，吃力不讨好，以后要少整别催，涨跌都别催我。股市获利与否，不取决于一两天股价涨跌。评论一家公司，也不是随便看一眼利润表数据，就可以巴啦巴啦巴啦的……今天有事出门，等我抽空看完写完，自然会发上来的</p>
