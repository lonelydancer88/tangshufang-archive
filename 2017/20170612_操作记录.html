<h1>操作记录</h1>
<p>2017年6月12日 实在不习惯持有指数，名称背后没有鲜活的公司，总觉得别扭。趁今早腾讯调整，出了占比约2%的广发医药指数基金，换入腾讯。当前实盘持仓41%+<a href="https://laotang.pages.dev/companies/%E8%B4%B5%E5%B7%9E%E8%8C%85%E5%8F%B0">茅台</a>，27%-<a href="https://laotang.pages.dev/companies/%E5%9B%BD%E6%8A%95%E7%94%B5%E5%8A%9B">国投</a>，8%+招行H，8%-民生H，5%+<a href="https://laotang.pages.dev/companies/%E6%B4%8B%E6%B2%B3%E8%82%A1%E4%BB%BD">洋河</a>，5%-<a href="https://laotang.pages.dev/companies/%E8%85%BE%E8%AE%AF%E6%8E%A7%E8%82%A1">腾讯</a>，3%+<a href="https://laotang.pages.dev/companies/%E4%BF%A1%E7%AB%8B%E6%B3%B0">信立泰</a>，3%-<a href="https://laotang.pages.dev/companies/%E5%8F%8C%E6%B1%87%E5%8F%91%E5%B1%95">双汇</a>，1%+<a href="https://laotang.pages.dev/companies/%E6%B5%B7%E5%BA%B7%E5%A8%81%E8%A7%86">海康</a>，其他观察仓宋城和伟星忽略。雪球实盘组合无法写入港股，索性等近期减仓茅台后再行调整。</p>
